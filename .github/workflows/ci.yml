name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint, format & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Install dev tools (without native zfoundry-zgame)
        run: |
          uv venv
          uv pip install --no-deps -e .
          uv pip install numpy pytest ruff pyrefly
      - name: Ruff lint
        run: uv run --no-sync ruff check unismac tests examples
      - name: Ruff format check
        run: uv run --no-sync ruff format --check unismac tests examples
      - name: Pyrefly typecheck
        run: uv run --no-sync pyrefly check

  test-pure-python:
    name: Pure-Python tests (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        python-version: ['3.10', '3.12', '3.14']
        exclude:
          - os: macos-15
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pure-Python unismac (no zgame)
        run: |
          uv venv
          uv pip install --no-deps -e .
          uv pip install "numpy>=1.26" "pytest>=8.0"
      - name: Run unit tests without zgame
        env:
          OMP_NUM_THREADS: '1'
        run: uv run --no-sync pytest -m "not sc2 and not slow"

  test-with-zgame:
    name: Full tests with zgame (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        python-version: ['3.10', '3.12', '3.14']
        exclude:
          - os: macos-15
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install unismac with zfoundry-zgame
        run: |
          uv venv
          uv pip install -e . "pytest>=8.0"
      - name: Verify Rust manifest consistency
        run: uv run --no-sync python -m unismac.env.accel.manifest
      - name: Verify accel='rust' active & run test suite
        env:
          OMP_NUM_THREADS: '1'
        run: |
          uv run --no-sync python -c "
          import zgame
          from unismac.env import accel, make_vec_env
          from unismac.env.accel import manifest
          assert zgame.CONTRACT_VERSION == '0.2'
          assert zgame.env.SEMANTICS == 3
          assert accel.native_available()
          assert not manifest.diff(manifest.load(), manifest.current())
          with make_vec_env('smac-portable', '3m', backend='zgame', batch_size=1) as env:
              assert env.accel == 'rust', env.accel
              env.reset()
              step = env.step(env.avail_actions().argmax(-1))
              assert step.reward.shape == (1,) and step.terminated.shape == (1,)
          print('zgame version:', zgame.__version__, 'accel verified: rust')
          "
          uv run --no-sync pytest -m "not sc2 and not slow"

  test-adapters:
    name: Adapter contract tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install unismac with zgame and optional RL adapters
        run: |
          uv venv
          uv pip install -e ".[adapters]" "pytest>=8.0" "pyrefly>=0.30"
      - name: Typecheck adapters against real stubs
        run: uv run --no-sync pyrefly check unismac/adapters tests/adapters
      - name: Run official Gymnasium & PettingZoo contract test suites
        env:
          OMP_NUM_THREADS: '1'
        run: uv run --no-sync pytest tests/adapters
