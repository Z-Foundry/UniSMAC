name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & verify sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Verify matching zfoundry-zgame binary wheel is available on PyPI
        run: |
          uv venv .venv-check
          uv pip install --python .venv-check --only-binary=:all: "zfoundry-zgame>=0.1.0,<0.2.0"
      - name: Build sdist and wheel
        run: uv build --out-dir dist
      - name: Verify wheel contents and run smoke tests
        env:
          OMP_NUM_THREADS: '1'
        run: |
          python3 -c "
          import glob, zipfile
          whls = glob.glob('dist/unismac-*.whl')
          assert len(whls) == 1, whls
          with zipfile.ZipFile(whls[0]) as zf:
              bad = [n for n in zf.namelist() if n.endswith(('.so', '.pyd', '_zgame.build.json'))]
              assert not bad, f'unexpected native artifacts in unismac wheel: {bad}'
          print('Wheel audit clean:', whls[0])
          "
          uv venv .venv-test
          uv pip install --python .venv-test --find-links dist unismac "pytest>=8.0"
          .venv-test/bin/python -m unismac.env.manifest
          .venv-test/bin/python -m pytest tests -m "not sc2 and not slow"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/unismac
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: List distributions
        run: ls -la dist/
      - name: Publish distributions via Trusted Publisher (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
